<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Techstacity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen">
    <div class="text-center px-6">
        <p class="text-sm font-semibold text-blue-600 uppercase tracking-wide">404 Error</p>
        <h1 class="mt-2 text-5xl font-extrabold text-gray-900 tracking-tight sm:text-6xl">Page not found.</h1>
        <p class="mt-4 text-lg text-gray-500">Sorry, we couldn’t find the page you’re looking for.</p>
        
        <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/" class="rounded-md bg-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition-all">
                Back to Techstacity
            </a>
            <a href="mailto:techstacity.yt@gmail.com" class="text-sm font-semibold text-gray-900 hover:text-blue-600">
                Contact support <span aria-hidden="true">&rarr;</span>
            </a>
        </div>

        <div class="mt-12">
            <img src="images/404-design.png" alt="404 Illustration" class="w-64 mx-auto opacity-80">
        </div>
    </div>
</body>
</html>
