<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techstacity Media Company | Portfolio</title>
    <meta name="description" content="Welcome to the future of brand storytelling. At Techstacity Media & Design, we don’t just build assets; we engineer experiences. Whether you need a visual identity that screams 'innovation' or a digital strategy that converts, we’re the bridge between your vision and your audience.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.css"></script>
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="images/main_logo.png" type="image/x-icon">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0f172a',    // Deep Slate for Trust/Security
                            gold: '#fbbf24',    // Amber for Energy/Solar
                            green: '#22c55e',   // Green for Eco/Smart
                            light: '#f8fafc',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles for better aesthetics */
        .glass-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
        }
        .hero-overlay {
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8));
        }
        .service-card:hover .service-icon {
            transform: scale(1.1) rotate(-5deg);
        }
        .gallery-img {
            transition: transform 0.3s ease-in-out;
        }
        .gallery-img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="font-sans text-gray-800 bg-gray-50 antialiased overflow-x-hidden">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300" id="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2">
                    
                    <span class="text-white text-2xl font-bold tracking-tight"><a href="index.html">Techstacity</a></span>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="about.html" class="text-gray-300 hover:text-brand-gold px-3 py-2 rounded-md text-sm font-medium transition-colors">About</a>
                        <a href="services.html" class="text-gray-300 hover:text-brand-gold px-3 py-2 rounded-md text-sm font-medium transition-colors">Services</a>
                        <a href="portfolio.html" class="text-gray-300 hover:text-brand-gold px-3 py-2 rounded-md text-sm font-medium transition-colors">Our Portfolio</a>
                        <a href="#testimonials" class="text-gray-300 hover:text-brand-gold px-3 py-2 rounded-md text-sm font-medium transition-colors">Testimonials</a>
                        <a href="contact.html" class="text-gray-300 hover:text-brand-gold px-3 py-2 rounded-md text-sm font-medium transition-colors">
                            Contact Us
                        </a>
                        <a href="booking.html" class="bg-green-500 text-brand-blue hover:bg-green-400 px-5 py-2.5 rounded-full text-sm font-bold shadow-lg transition-transform hover:scale-105">
                            Booking
                        </a>
                    </div>
                </div>

                <!-- Mobile menu button -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" onclick="toggleMobileMenu()" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none transition">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="md:hidden hidden bg-brand-blue border-t border-gray-700" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="about.html" onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">About</a>
                <a href="services.html" onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Services</a>
                <a href="portfolio.html" onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Portfolio</a>
                <a href="#testimonials" onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Testimonials</a>
                <a href="contact.html" onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Contact Us</a>
                <a href="booking.html" onclick="toggleMobileMenu()" class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Booking</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="relative h-screen flex items-center justify-center overflow-hidden">
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <video src="images/montage.mp4" 
                   alt="Techstacity Media Agency office layout" 
                   class="w-full h-full object-cover" 
                   autoplay muted loop>
            <div class="absolute inset-0 hero-overlay"></div>
        </div>

    </section>


    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/254758130962?text=I would like to learn more about branding" target="_blank" class="fixed bottom-6 right-6 z-50 bg-green-500 text-white p-4 rounded-full shadow-lg hover:bg-green-600 transition-all hover:scale-110 flex items-center justify-center group">
        <i class="fa-brands fa-whatsapp text-3xl"></i>
        <span class="absolute right-full mr-3 bg-white text-gray-800 text-sm px-3 py-1 rounded shadow opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
            Chat on WhatsApp
        </span>
    </a>

    <!-- Scripts -->
    <script>
        // Set Current Year
        document.getElementById('year').textContent = new Date().getFullYear();

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Navbar Scroll Effect
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('shadow-md');
                navbar.classList.remove('py-4');
            } else {
                navbar.classList.remove('shadow-md');
                // navbar.classList.add('py-4'); // Optional padding shift
            }
        });
    </script>
</body>
</html>
